[project]
name = "instagram-agent"
version = "1.0.0"
description = "AI Brand Research Assistant for Instagram creator collaborations"
readme = "README.md"
authors = [
    { name = "Zuzanna", email = "54065733+marcheweczka007@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "browser-use>=0.13.7",
    "openai>=2.16.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "rich>=14.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
instagram-agent = "instagram_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
